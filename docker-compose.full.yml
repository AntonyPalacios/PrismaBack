# Full stack (db + backend + web) on a machine that only has Docker.
#   docker compose -f docker-compose.full.yml up -d --build
# Open http://localhost:8080. See README "Levantar el sistema completo con Docker".
#
# Independent from docker-compose.yml (dev database only): its own project
# name, containers and volume, and the db port is not published, so both can
# run on the same machine. The backend port is not published either; only the
# web container (Caddy) is reachable.
name: prisma-full

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-prisma}
      POSTGRES_USER: ${DB_USER:-prisma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prisma} -d ${DB_NAME:-prisma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Secrets (Google OAuth, JWT) come from .env and are never baked into the image.
    env_file: .env
    # These win over .env: inside the stack the db is "db", and the browser
    # reaches everything through the web container on APP_PORT.
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-prisma}
      FRONTEND_BASE_URL: http://localhost:${APP_PORT:-8080}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080}
      # plain http on localhost; true once it runs behind HTTPS
      APP_JWT_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # trust X-Forwarded-* from Caddy (the only thing that can reach this port)
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - backend_logs:/app/logs

  web:
    build: ${FRONTEND_DIR:-../frontend}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Google redirect URI: http://localhost:<APP_PORT>/login/oauth2/code/google
      - "${APP_PORT:-8080}:80"

volumes:
  db_data:
  backend_logs:

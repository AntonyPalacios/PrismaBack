name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's previous run. Runs on main are keyed by
# commit, so they never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Docs-only PRs skip the build steps, but the job itself still runs and
      # reports green, so the required check never stays pending.
      - name: Detect code changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

      - name: Set up Java 21
        if: github.event_name == 'push' || steps.changes.outputs.code == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      # Unit tests + Testcontainers ITs (the runner ships with Docker).
      - name: Build and test
        if: github.event_name == 'push' || steps.changes.outputs.code == 'true'
        run: ./mvnw -B verify

      - name: Skip notice
        if: github.event_name == 'pull_request' && steps.changes.outputs.code != 'true'
        run: echo "Docs-only change, build and tests skipped."

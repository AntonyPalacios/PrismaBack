spring:
  application:
    name: prisma-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prisma}
    username: ${DB_USER:prisma}
    password: ${DB_PASSWORD:prisma}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only ever checks it matches — it
      # never creates or alters tables. If this fails on startup, the fix is
      # a new Flyway migration, never flipping this to `update`.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
        provider:
          google:
            user-name-attribute: email

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    cookie-name: prisma_token
    # true in production (HTTPS); overridden to false for local http dev in application-dev.yml
    cookie-secure: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
  writer-with-order-by-keys: false

# Every request gets a traceId (no exporter: it only feeds the log lines and
# the errorId of error responses). 1.0 = never skip a request.
management:
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    pe.com.edu.prisma: INFO
  file:
    name: ${LOG_FILE_NAME:logs/prisma.log}
  logback:
    rollingpolicy:
      # a new file every day, or sooner when the current one reaches 10 MB
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  pattern:
    # printed on every line of a request; grep the errorId as "trace=<id>"
    correlation: "[trace=%X{traceId:-} user=%X{userId:-}] "
